name: Coach scheduler
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run durable coach scheduler
        env:
          API_URL: ${{ secrets.FITTRACK_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$API_URL" && test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 240 -X POST "${API_URL%/}/internal/coach-tick" -H "Authorization: Bearer $CRON_SECRET"
